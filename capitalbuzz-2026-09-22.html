<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CapitalBuzz — Tuesday Sep 22, 2026</title></head><body><p>Loading desk…</p><script>
(async function(){
const b64=await fetch("cb-2026-09-22.v2.b64.txt").then(r=>r.text());
const bin=Uint8Array.from(atob(b64.trim()), c=>c.charCodeAt(0));
const ds=new DecompressionStream("gzip");
const stream=new Response(bin).body.pipeThrough(ds);
const text=await new Response(stream).text();
document.open();document.write(text);document.close();
})().catch(e=>{document.body.textContent="Failed to load desk: "+e});
</script></body></html>
